<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Interactive network map of major Japanese voicebank (Vocaloid / UTAU / Synthesizer V) IP holders and their characters. Explore Crypton Future Media, AHS, Kamitsubaki Studio, 1st PLACE, Twindrill, and Internet Co.">
  <meta name="theme-color" content="#05050a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Voicebank">
  <title>Voicebank Central — Interactive Network Map</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fixed site header -->
  <header class="galaxy-header" id="site-header">
    <h1 class="title-main">Voicebank Central</h1>
    <p class="title-sub">Click a company hub to explore its voicebanks</p>
  </header>

  <!-- Main interactive viewport -->
  <div class="galaxy-viewport" id="galaxy-viewport" role="application" aria-label="Interactive voicebank network map">

    <!-- Layered backgrounds -->
    <div id="gradient-bg-layer" class="gradient-scroller" aria-hidden="true"></div>
    <div id="circuit-bg-layer" class="circuit-layer" aria-hidden="true"></div>
    <div id="particle-canvas" class="particle-layer" aria-hidden="true"></div>
    <div class="galaxy-overlay" id="galaxy-overlay" aria-hidden="true"></div>

    <!-- The large pannable / zoomable canvas containing all company hubs -->
    <main class="universe-canvas" id="universe-canvas">

      <section id="cfm" class="galaxy-container" style="top: 1000px; left: 1000px;" aria-labelledby="hub-cfm">
        <button type="button" class="center-hub center-hub-cfm" id="hub-cfm" data-company="cfm" aria-expanded="false" aria-controls="cfm">
          Crypton<br>Future<br>Media
        </button>
      </section>

      <section id="ahs" class="galaxy-container" style="top: 1350px; left: 600px;" aria-labelledby="hub-ahs">
        <button type="button" class="center-hub center-hub-ahs" id="hub-ahs" data-company="ahs" aria-expanded="false" aria-controls="ahs">
          AHS
        </button>
      </section>

      <section id="kamitsubaki" class="galaxy-container" style="top: 670px; left: 1400px;" aria-labelledby="hub-kamitsubaki">
        <button type="button" class="center-hub center-hub-kamitsubaki" id="hub-kamitsubaki" data-company="kamitsubaki" aria-expanded="false" aria-controls="kamitsubaki">
          KAMITSUBAKI
        </button>
      </section>

      <section id="frstplace" class="galaxy-container" style="top: 1350px; left: 1400px;" aria-labelledby="hub-frstplace">
        <button type="button" class="center-hub center-hub-frstplace" id="hub-frstplace" data-company="frstplace" aria-expanded="false" aria-controls="frstplace">
          1stPLACE
        </button>
      </section>

      <section id="twindrill" class="galaxy-container" style="top: 650px; left: 600px;" aria-labelledby="hub-twindrill">
        <button type="button" class="center-hub center-hub-twindrill" id="hub-twindrill" data-company="twindrill" aria-expanded="false" aria-controls="twindrill">
          TWINDRILL
        </button>
      </section>

      <section id="internet" class="galaxy-container" style="top: 1000px; left: 400px;" aria-labelledby="hub-internet">
        <button type="button" class="center-hub center-hub-internet" id="hub-internet" data-company="internet" aria-expanded="false" aria-controls="internet">
          INTERNET<br>Co.
        </button>
      </section>

    </main>

    <!-- Bottom navigation dock -->
    <nav class="galaxy-nav" id="galaxy-nav" aria-label="Company navigation">
      <button type="button" class="nav-btn" data-target="home" aria-label="Reset view to overview">
        Reset View
      </button>
      <button type="button" class="nav-btn" data-target="cfm">CFM</button>
      <button type="button" class="nav-btn" data-target="ahs">AHS</button>
      <button type="button" class="nav-btn" data-target="kamitsubaki">Kamitsubaki</button>
      <button type="button" class="nav-btn" data-target="frstplace">1stPlace</button>
      <button type="button" class="nav-btn" data-target="twindrill">Twindrill</button>
      <button type="button" class="nav-btn" data-target="internet">Internet Co.</button>
    </nav>

  </div>

  <!-- Portrait modal (accessible dialog) -->
  <dialog id="portrait-modal" class="modal-overlay" aria-labelledby="modal-title">
    <div class="modal-card">
      <button type="button" class="modal-close-btn" aria-label="Close portrait view">&times;</button>
      <h2 id="modal-title" class="visually-hidden">Character Portrait</h2>
      <div class="modal-image-frame" role="img" aria-label="Full size character artwork"></div>
    </div>
  </dialog>

  <script src="script.js"></script>
  <script>
    // Register service worker for offline / install support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
